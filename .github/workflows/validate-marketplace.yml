name: Validate marketplace

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate marketplace contracts
        run: bash scripts/test-marketplace.test.sh
      - name: Run design-bench token tests
        run: bash plugins/design-bench/tests/extract-tokens.test.sh
